# PostgreSQL para desenvolvimento local: npm run db:up
services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca-jogos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca_jogos}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  biblioteca_pgdata:
